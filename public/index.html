<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vinchurkar Jewellers Billing</title>
<style>
:root{--bg:#FBF8F2;--card:#FFFFFF;--gold:#B8913A;--gold-l:#F1E4BC;--gold-xl:#FAF3DD;--silver:#C9CED6;--silver-d:#8B94A1;--ink:#34343A;--mute:#6F7480;--line:#E9E4D6;--bad:#B03A3A;--ok:#2F7D4F;--sh:0 2px 10px rgba(80,65,30,.07)}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#FDFBF6,#F6F2E8);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,sans-serif;min-height:100vh}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:600;color:var(--ink);margin:.3em 0}h2{font-size:26px}h3{font-size:18px;color:var(--gold);margin-top:22px}
h2::after{content:"";display:block;width:54px;height:3px;margin-top:6px;border-radius:2px;background:linear-gradient(90deg,var(--gold),var(--silver))}
#auth{max-width:430px;margin:8vh auto;padding:32px;border:1px solid var(--line);background:var(--card);border-radius:16px;box-shadow:var(--sh);border-top:4px solid var(--gold)}
#auth h1{color:var(--gold);margin-bottom:0}.logo{max-height:84px;max-width:84px;border-radius:50%;display:block;margin:0 auto 12px;box-shadow:0 4px 14px rgba(184,145,58,.28)}
#app{display:none;min-height:100vh}nav{width:230px;background:linear-gradient(180deg,#FFFFFF,#F4F1EA);border-right:1px solid var(--line);padding:18px 14px;position:fixed;top:0;bottom:0;overflow:auto}
.brand{text-align:center;padding-bottom:12px;margin-bottom:10px;border-bottom:1px solid var(--line)}.brand img{max-height:68px;max-width:68px;border-radius:50%;display:block;margin:0 auto 8px;box-shadow:0 3px 10px rgba(184,145,58,.25)}.brand h2{font-size:19px;color:var(--gold);margin:0}.brand h2::after{margin:6px auto 0}
nav button{display:block;width:100%;text-align:left;margin:3px 0;background:none;border:0;padding:10px 14px;border-radius:10px;cursor:pointer;font:inherit;color:var(--ink);transition:.15s}
nav button:hover{background:var(--gold-xl)}nav button.on{background:var(--gold-l);color:#6b5217;font-weight:600;box-shadow:inset 3px 0 0 var(--gold)}
nav #lock{margin-top:18px;color:var(--silver-d);border-top:1px solid var(--line);border-radius:0 0 10px 10px}
main{margin-left:230px;padding:28px 32px;max-width:1280px}
label{display:block;font-size:12px;margin-top:10px;color:var(--mute);font-weight:600;letter-spacing:.2px}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font:inherit;background:#fff;color:var(--ink);transition:.15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--gold);box-shadow:0 0 0 3px rgba(184,145,58,.16)}
button.p{background:linear-gradient(135deg,#C9A24B,#A9822D);color:#fff;border:0;padding:10px 20px;border-radius:10px;cursor:pointer;font:inherit;font-weight:600;margin-top:14px;box-shadow:0 2px 6px rgba(160,125,40,.3)}
button.p:hover{filter:brightness(1.06)}button.s{background:#fff;border:1px solid var(--silver);color:var(--ink);padding:6px 12px;border-radius:9px;cursor:pointer;font:inherit}button.s:hover{border-color:var(--gold);color:var(--gold)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin:14px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--sh);color:var(--mute);font-size:13px;border-top:3px solid var(--gold-l)}
.card b{display:block;font-size:24px;color:var(--ink);font-family:Georgia,serif;margin:2px 0}
table{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--sh);margin:8px 0}
th{background:linear-gradient(180deg,#F6EDD0,#EFE2B8);color:#5b4713;text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);font-size:13px}tr:last-child td{border-bottom:0}tbody tr:hover td{background:#FDFAF1}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
#msg:not(:empty){display:block;padding:12px 16px;border-radius:10px;margin:14px 0;font-size:14px;font-weight:600;box-shadow:var(--sh)}
#msg.err{background:#FFF2F0;border:1px solid #FFCCC7;color:#CF1322}
#msg.ok{background:#F6FFED;border:1px solid #D9F7BE;color:#389E0D}
.input-invalid{border-color:#F5222D!important;box-shadow:0 0 0 3px rgba(245,34,45,.18)!important;background:#FFFBFB!important}
.err{color:var(--bad)}.ok{color:var(--ok)}
.item{border:1px solid var(--line);background:var(--card);padding:14px;border-radius:14px;margin:10px 0;box-shadow:var(--sh);border-left:4px solid var(--silver)}
.warn{background:var(--gold-xl);border:1px solid var(--gold-l);padding:10px 14px;border-radius:10px;font-size:13px;color:#6b5217}
a{color:var(--gold);cursor:pointer;text-decoration:none;font-weight:600}a:hover{text-decoration:underline}
.hb{display:grid;grid-template-columns:150px 1fr 120px;gap:10px;align-items:center;margin:7px 0;font-size:13px}.hb .tr{background:#EFEBE0;border-radius:6px;height:12px;overflow:hidden}
.hb i{display:block;height:100%;background:linear-gradient(90deg,#D9BC6B,#B8913A);border-radius:6px}.hb b{text-align:right}.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 18px 14px;box-shadow:var(--sh)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
@media(max-width:820px){nav{position:static;width:auto;display:flex;flex-wrap:wrap;gap:4px}.brand{width:100%}main{margin:0;padding:16px}}
</style></head><body><div id="auth"></div>
<div id="app"><nav><div class="brand"><img id="slogo" alt="" style="display:none"><h2 id="sname">Vinchurkar Jewellers</h2></div>
<button data-v="dash">Dashboard</button><button data-v="bill">New Bill</button><button data-v="search">Search Bill</button>
<button data-v="history">Invoice History</button><button data-v="reports">Sales Reports</button><button data-v="analytics">Analytics</button><button data-v="settings">Settings</button>
<button id="lock">Lock / Sign out</button></nav><main id="main"></main></div>
<script src="app.js?v=3"></script></body></html>
